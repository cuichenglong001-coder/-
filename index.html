<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>贪吃蛇</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="hud">
        <div class="brand">
          <h1>贪吃蛇</h1>
          <p>方向键或 WASD 控制，空格暂停</p>
        </div>
        <div class="stats">
          <div class="stat">
            <span class="label">分数</span>
            <span id="score">0</span>
          </div>
          <div class="stat">
            <span class="label">最高</span>
            <span id="high-score">0</span>
          </div>
        </div>
      </header>

      <section class="board-wrap">
        <canvas id="board" width="480" height="480" aria-label="贪吃蛇游戏画布"></canvas>
        <div id="overlay" class="overlay">
          <h2 id="overlay-title">贪吃蛇</h2>
          <p id="overlay-text">按任意方向键或点击开始</p>
          <button id="start-btn" type="button">开始游戏</button>
        </div>
      </section>

      <div class="controls" aria-hidden="true">
        <button data-dir="up" type="button">↑</button>
        <div class="row">
          <button data-dir="left" type="button">←</button>
          <button data-dir="down" type="button">↓</button>
          <button data-dir="right" type="button">→</button>
        </div>
      </div>
    </main>
    <script src="game.js"></script>
  </body>
</html>
